name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/vsd ./cmd/cli

      - name: Bundle shared libraries (macOS)
        if: matrix.goos == 'darwin'
        run: |
          WRAPPERS_DIR=$(go env GOMODCACHE)/github.com/vultisig/go-wrappers@*/includes/darwin
          for dir in $WRAPPERS_DIR; do
            cp "$dir"/libgodkls.dylib dist/
            cp "$dir"/libgoschnorr.dylib dist/
          done
          install_name_tool -add_rpath @executable_path dist/vsd

      - name: Bundle shared libraries (Linux)
        if: matrix.goos == 'linux'
        run: |
          WRAPPERS_DIR=$(go env GOMODCACHE)/github.com/vultisig/go-wrappers@*/includes/linux
          for dir in $WRAPPERS_DIR; do
            cp "$dir"/libgodkls.so dist/
            cp "$dir"/libgoschnorr.so dist/
          done
          patchelf --set-rpath '$ORIGIN' dist/vsd

      - name: Create archive
        run: |
          cd dist
          tar czf vsd_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz *
          shasum -a 256 vsd_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > vsd_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsd_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/vsd_${{ matrix.goos }}_${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
